description: |
  With the fundamentals in place, this level is about strategy: a
  framework for deciding where AI investment is actually worth it, how to
  measure whether it paid off, and — because large language models
  specifically are what most organizations are evaluating right now — how
  they work well enough to ask sharp questions about a vendor's claims.

  Two courses: AI strategy and business value, then responsible AI for
  organizations.
